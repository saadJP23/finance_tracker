<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal finance tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>




  <body>
   <header>  
      <h1>Personal finance tracker</h1>
   </header>










   <div class="container" 
    <nav>

      <ul class="navbar_features">
        <li>
          <button class="navbar_buttons">Dashboard</button>
        </li>
        <li>
          <button class="navbar_buttons">Add expense</button>
        </li>
        <li>
          <button class="navbar_buttons">Income Tracking</button>
        </li>
        <li>
          <button class="navbar_buttons">Monthly budget</button>
        </li>
        <li>
          <button class="navbar_buttons">Transaction History</button>
        </li>
      </ul>

    </nav>
















    
    <main class="main_class">

    <section id="dashboard" class="card">

    <h2>Dashboard</h2>

    <div class="summary">

      <div class="dashboard_divs">      
        <h3>Income</h3>
        <p id="total_income">$0</p>
      </div>

      <div class="dashboard_divs">
        <h3>Expenses</h3>
        <p id="total_expenses">$0</p>
      </div>

      <div class="dashboard_divs">
        <h3 >Balance</h3>
        <p id="balance">$0</p>
    </div>

    </section>


    <section id="expense_main" class="card">
      <h4>Add Expense</h4>
      <div>
      <form id="expense_form">
        <input type="text" id="expense_description" placeholder="Expense name" required />
        <input type="number" id="expense_amount" placeholder="Amount" required />
        <button type="submit" class="submit_button">Add</button>
        </div>
    </section>






    <section id="transaction_history" class="card">
      <h2>Transaction History</h2>
      <table>
        <thead id="table_header">
          <tr>
            <th>Name</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
          </tr>
        </thead>
      </table>
    </section>
    </main>


   </div>

    <script src="app.js"></script>
  </body>
