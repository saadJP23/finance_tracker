<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal finance tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>




  <body>
   <header>  
      <h1>Personal finance tracker</h1>
   </header>


   <div class="container" 
    <nav>

      <ul class="navbar_features">
        <li>
          Dashboard
        </li>
        <li>
          Add expense
        </li>
        <li>
          Income Tracking
        </li>
        <li>
          Monthly budget
        </li>
        <li>
          Transaction History
        </li>
      </ul>

    </nav>

    <main>
    <section id="dashboard" class="card">
    <h2>Dashboard</h2>
    <div class="summary">
      <div class="dashboard_divs">      
        <h3>Income</h3>
        <p id="total_income">$0</p>
      </div>
      <div class="dashboard_divs">
        <h3>Expenses</h3>
        <p id="total_expenses">$0</p>
      </div>
      <div class="dashboard_divs">
        <h3 >Balance</h3>
        <p id="balance">$0</p>
    </div>
    </section>

    <h1>Hello world</h1>
    </main>


   </div>

    <script src="app.js"></script>
  </body>
