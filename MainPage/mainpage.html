<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PFT Dashboard</title>
    <link rel="stylesheet" href="css/mainpagestyle.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <header>
      <div class="navbar">
        <h2>PFT</h2>
        <div class="nav-links">
          <a href="#">Dashboard</a>
          <a href="#">Analytics</a>
          <a href="#">Goals</a>
          <a href="#">Transactions</a>
        </div>
        <div class="nav-buttons">
          <button class="profile_button">Profile</button>
        </div>
      </div>
    </header>

    <!-- Main Content: Main Page Content -->
    <div class="main">
      <!-- Dashboard Overview -->
      <div class="card">
        <h3>Dashboard Overview</h3>
        <div class="dashboard_div">
          <fieldset class="income_fieldset">
            <label><b>Total Income:</b></label>
          </fieldset>
          <fieldset class="expense_fieldset"><b>Expense:</b></fieldset>
          <fieldset class="balance_fieldset"><b>Balance:</b></fieldset>
        </div>
      </div>

      <!-- Reminders -->
      <div class="card">
        <h3>Upcoming Bills & Reminders</h3>
        <ul>
          <li>
            💡 Electricity Bill
            <input type="date" value="2025-10-10" />
          </li>
          <li>
            🏠 Rent Payment
            <input type="date" value="2025-10-15" />
          </li>
          <li>
            📱 Phone Bill
            <input type="date" value="2025-10-20" />
          </li>
        </ul>
      </div>

      <!-- Add & Budget Section -->
      <div class="card">
        <h3>Analytics</h3>
        <div class="analytics_div">
          <fieldset class="incomegraph_fieldset">
            graph of monthly income
          </fieldset>
          <fieldset class="expensegraph_fieldset">graph of expense</fieldset>
          <fieldset class="balancegraph_fieldset">graph of balance</fieldset>
        </div>
      </div>
    </div>
  </body>
</html>
