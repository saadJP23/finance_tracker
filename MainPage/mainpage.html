<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PFT Dashboard</title>
    <link rel="stylesheet" href="css/mainpagestyle.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <div class="navbar">
      <h2>💰 PFT</h2>
      <div class="nav-links">
        <a href="#">Dashboard</a>
        <a href="#">Analytics</a>
        <a href="#">Goals</a>
        <a href="#">Transactions</a>
      </div>
      <div class="nav-buttons">
        <button>Log in / Sign up</button>
        <button>Profile</button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main">
      <!-- Dashboard Overview -->
      <div class="card">
        <h3>Dashboard Overview</h3>
        <label><b>Total Income:</b></label>
        <input type="number" value="85000" /> <br /><br />

        <label><b>Total Expenses:</b></label>
        <input type="number" value="45000" /> <br /><br />

        <h4>Expense Categories:</h4>
        <ul>
          <li>🏠 Rent</li>
          <li>🛒 Grocery</li>
          <li>🚇 Transport</li>
          <li>📺 Subscriptions</li>
        </ul>
      </div>

      <!-- Reminders -->
      <div class="card">
        <h3>Upcoming Bills & Reminders</h3>
        <ul>
          <li>
            💡 Electricity Bill
            <input type="date" value="2025-10-10" />
          </li>
          <li>
            🏠 Rent Payment
            <input type="date" value="2025-10-15" />
          </li>
          <li>
            📱 Phone Bill
            <input type="date" value="2025-10-20" />
          </li>
        </ul>
      </div>

      <!-- Add & Budget Section -->
      <div class="card">
        <h3>Quick Add & Budget</h3>
        <button>+100</button>
        <button>+1000</button>
        <button>+10000</button>
        <br /><br />
        <button>Set Monthly Budget</button>
      </div>
    </div>
  </body>
</html>
